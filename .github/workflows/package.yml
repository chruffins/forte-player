name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libtag1-dev liballegro5-dev liballegro-acodec5-dev liballegro-image5-dev liballegro-dialog5-dev liballegro-ttf5-dev liballegro-font5-dev liballegro-primitives5-dev wget fuse
      - name: Install linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          chmod +x /tmp/linuxdeploy
          sudo mv /tmp/linuxdeploy /usr/local/bin/linuxdeploy
      - name: Build AppImage
        run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forte-player-linux
          path: dist/*.AppImage

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Install native dependencies
        run: brew install allegro taglib dylibbundler
      - name: Build app bundle
        run: packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forte-player-macos
          path: dist/forte-player-macos.dmg

  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Build portable archive
        shell: pwsh
        run: packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: forte-player-windows
          path: dist/forte-player-windows.zip
